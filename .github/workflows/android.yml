name: Android
on: [push]
jobs:
  build:
    name: VKVKVKVKVKKVVKKGL
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@main
    - name: build
      run: |
        $ANDROID_NDK_LATEST_HOME/ndk-build -j8 APP_PLATFORM=android-24 APP_ABI=arm64-v8a NDK_PROJECT_PATH=./ APP_BUILD_SCRIPT=./Android.mk NDK_APP_APPLICATION_MK=./Application.mk

    - name: Upload build output
      uses: actions/upload-artifact@main
      with:
        name: VKGGGGGGGGGGGL
        path: |
              **/*.so
